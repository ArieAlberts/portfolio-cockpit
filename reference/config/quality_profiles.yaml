# QUALITY-profielen per company_type.
#
# quality_score = clamp(50 + 50 * sum(metric_weight * normalized_signal), 0, 100)
#
# metric_weight = category.weight * metric.weight  (binnen een categorie tellen
# de metric-gewichten op tot 1.0; de categoriegewichten tellen op tot 1.0).
#
# Vertaling van verandering naar normalized_signal (-1..+1):
#   mode: relative  -> delta = (raw - baseline) / |baseline|
#   mode: absolute  -> delta = raw - baseline            (bv. procentpunten)
#   mode: direct    -> raw_value IS al een signaal in -1..+1
#                      (handmatige beoordeling van mijlpalen / thesis-uitvoering)
#   direction: higher_better | lower_better
#   full_scale: de verandering die exact ±1 oplevert; daarboven wordt geclampt.
#   dead_band: veranderingen kleiner dan dit tellen als 0 (ruisfilter).
#
# Prijsafhankelijke grootheden (koers, P/E, dividendrendement, FCF-yield,
# EV/EBITDA, marktkapitalisatie) zijn in QUALITY verboden; de loader weigert ze.

forbidden_price_dependent_metrics:
  - price
  - market_cap
  - pe
  - forward_pe
  - ev_ebitda
  - ev_ebit
  - fcf_yield
  - dividend_yield
  - price_to_book
  - price_to_nav
  - shareholder_yield

profiles:

  GENERAL_OPERATING_COMPANY:
    categories:
      profitability:
        weight: 0.25
        metrics:
          roic:            {weight: 0.6, mode: absolute, direction: higher_better, full_scale: 5.0,  dead_band: 0.5}
          operating_margin: {weight: 0.4, mode: absolute, direction: higher_better, full_scale: 4.0,  dead_band: 0.3}
      growth:
        weight: 0.20
        metrics:
          revenue_growth_3y: {weight: 0.5, mode: absolute, direction: higher_better, full_scale: 5.0, dead_band: 0.5}
          fcf_per_share_growth_3y: {weight: 0.5, mode: absolute, direction: higher_better, full_scale: 7.0, dead_band: 0.5}
      cash_conversion:
        weight: 0.20
        metrics:
          fcf_to_net_income: {weight: 1.0, mode: absolute, direction: higher_better, full_scale: 0.25, dead_band: 0.03}
      balance_sheet:
        weight: 0.15
        metrics:
          net_debt_to_ebitda: {weight: 0.6, mode: absolute, direction: lower_better, full_scale: 1.5, dead_band: 0.1}
          interest_coverage:  {weight: 0.4, mode: relative, direction: higher_better, full_scale: 0.5, dead_band: 0.05}
      capital_allocation:
        weight: 0.10
        metrics:
          share_count_change_pct: {weight: 0.5, mode: absolute, direction: lower_better, full_scale: 3.0, dead_band: 0.3}
          roic_minus_wacc:        {weight: 0.5, mode: absolute, direction: higher_better, full_scale: 5.0, dead_band: 0.5}
      thesis_execution:
        weight: 0.10
        metrics:
          thesis_execution_assessment: {weight: 1.0, mode: direct, direction: higher_better, full_scale: 1.0, dead_band: 0.0}

  INSURER:
    # Geen FCF-yield, EV/EBITDA of Net Debt/EBITDA voor verzekeraars.
    excluded_metrics: [fcf_to_net_income, net_debt_to_ebitda, roic, fcf_yield, ev_ebitda]
    categories:
      profitability:
        weight: 0.25
        metrics:
          roe:            {weight: 0.5, mode: absolute, direction: higher_better, full_scale: 4.0, dead_band: 0.5}
          combined_ratio: {weight: 0.5, mode: absolute, direction: lower_better,  full_scale: 4.0, dead_band: 0.5}
      capital_position:
        weight: 0.20
        metrics:
          solvency_ratio: {weight: 1.0, mode: absolute, direction: higher_better, full_scale: 30.0, dead_band: 3.0}
      growth:
        weight: 0.20
        metrics:
          premium_growth:          {weight: 0.4, mode: absolute, direction: higher_better, full_scale: 5.0, dead_band: 0.5}
          operating_profit_growth: {weight: 0.6, mode: absolute, direction: higher_better, full_scale: 8.0, dead_band: 1.0}
      book_value:
        weight: 0.15
        metrics:
          book_value_per_share: {weight: 1.0, mode: relative, direction: higher_better, full_scale: 0.20, dead_band: 0.02}
      capital_distributions:
        weight: 0.10
        metrics:
          capital_distribution_per_share: {weight: 1.0, mode: relative, direction: higher_better, full_scale: 0.25, dead_band: 0.02}
      thesis_execution:
        weight: 0.10
        metrics:
          thesis_execution_assessment: {weight: 1.0, mode: direct, direction: higher_better, full_scale: 1.0, dead_band: 0.0}

  DEVELOPMENT_PRE_REVENUE:
    excluded_metrics: [roic, operating_margin, fcf_to_net_income, net_debt_to_ebitda]
    categories:
      liquidity:
        weight: 0.25
        metrics:
          cash_runway_months:          {weight: 0.6, mode: absolute, direction: higher_better, full_scale: 12.0, dead_band: 1.0}
          financing_requirement_musd:  {weight: 0.4, mode: relative, direction: lower_better,  full_scale: 0.5,  dead_band: 0.05}
      dilution:
        weight: 0.15
        metrics:
          share_count_change_pct: {weight: 1.0, mode: absolute, direction: lower_better, full_scale: 20.0, dead_band: 2.0}
      regulatory_milestones:
        weight: 0.20
        metrics:
          licensing_milestone_assessment: {weight: 1.0, mode: direct, direction: higher_better, full_scale: 1.0, dead_band: 0.0}
      project_milestones:
        weight: 0.15
        metrics:
          project_milestone_assessment: {weight: 1.0, mode: direct, direction: higher_better, full_scale: 1.0, dead_band: 0.0}
      commercial:
        weight: 0.15
        metrics:
          contracted_backlog_musd: {weight: 1.0, mode: relative, direction: higher_better, full_scale: 1.0, dead_band: 0.05}
      thesis_execution:
        weight: 0.10
        metrics:
          schedule_slippage_months: {weight: 1.0, mode: absolute, direction: lower_better, full_scale: 12.0, dead_band: 1.0}

  CYCLICAL_MINING:
    categories:
      normalized_cash_flow:
        weight: 0.25
        metrics:
          normalized_fcf_per_share: {weight: 1.0, mode: relative, direction: higher_better, full_scale: 0.30, dead_band: 0.03}
      balance_sheet:
        weight: 0.20
        metrics:
          net_debt_to_normalized_ebitda: {weight: 1.0, mode: absolute, direction: lower_better, full_scale: 1.0, dead_band: 0.1}
      cost_position:
        weight: 0.20
        metrics:
          aisc_cost_curve_position: {weight: 1.0, mode: absolute, direction: lower_better, full_scale: 20.0, dead_band: 2.0}
      execution:
        weight: 0.15
        metrics:
          production_vs_guidance_pct: {weight: 0.6, mode: absolute, direction: higher_better, full_scale: 10.0, dead_band: 1.0}
          project_milestone_assessment: {weight: 0.4, mode: direct, direction: higher_better, full_scale: 1.0, dead_band: 0.0}
      reserves:
        weight: 0.10
        metrics:
          reserve_life_years: {weight: 1.0, mode: absolute, direction: higher_better, full_scale: 5.0, dead_band: 0.5}
      capital_allocation:
        weight: 0.10
        metrics:
          share_count_change_pct: {weight: 0.5, mode: absolute, direction: lower_better, full_scale: 5.0, dead_band: 0.5}
          thesis_execution_assessment: {weight: 0.5, mode: direct, direction: higher_better, full_scale: 1.0, dead_band: 0.0}
