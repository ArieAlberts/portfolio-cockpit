# CURRENT portfolio weights (owner-supplied). Target weights stay in
# config/portfolio.yaml and are only read. Empty values are a template:
# the decision engine refuses to run until every field is filled.
# weight_pct: current weight in percent; sector: free text; beta: optional.
#
# Sector: GICS-style labels; must match the names in config/risk_scenarios.yaml
#   (Financials, Materials, ...).
# Beta: Beta (5Y) from stockanalysis.com, retrieved 2026-10-04.
#   NOTE: European listings are measured against their LOCAL index (AEX/CAC/FTSE),
#   US listings against the S&P 500 -> not fully comparable; indicative only.
#   ABX and OKLO: history largely from the SPAC period -> beta unreliable (see comments).
schema_version: 1
as_of: null            # e.g. 2026-10-04
source: manual
cash_weight_pct: null
