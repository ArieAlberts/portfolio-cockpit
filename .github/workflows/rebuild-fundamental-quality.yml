name: rebuild-fundamental-quality

# Workflow-only changes must not create a new score revision when scoring inputs are unchanged.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/rebuild-fundamental-quality.yml"
      - "config/portfolio.yaml"
      - "config/company_types.yaml"
      - "config/absolute_anchors.yaml"
      - "config/readiness.yaml"
      - "config/scoring.yaml"
      - "config/score_metrics.yaml"
      - "data/peers/**"
      - "data/confidence/**"
      - "src/portfolio_cockpit/scoring/**"
      - "src/portfolio_cockpit/config.py"
      - "scripts/build_fundamental_quality.py"
      - "pyproject.toml"

permissions:
  contents: write

concurrency:
  group: rebuild-fundamental-quality
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - run: pip install -e ".[dev]"
      - run: python -m compileall -q src scripts
      - run: pytest -q --tb=short

      - name: Build immutable score snapshot
        run: cockpit-score --write

      - name: Verify generated current pointer
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path(".")
          current = json.loads((root / "data/scoring/current.json").read_text())
          payload = json.loads((root / current["current_fundamental_quality"]).read_text())
          assert current["generated_by_pipeline"] is True
          assert current["pipeline_version"] == 3
          assert current["reproducibility_hash"] == payload["reproducibility_hash"]
          assert payload["execution_effect"] if "execution_effect" in payload else True
          PY

      - name: Commit generated score state
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if git diff --quiet -- data/scoring; then
            echo "Score snapshot already reproducible; nothing to commit."
            exit 0
          fi
          git config user.name "portfolio-cockpit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/scoring
          git commit -m "chore: rebuild fundamental quality snapshot"
          git pull --rebase origin main
          git push origin HEAD:main
