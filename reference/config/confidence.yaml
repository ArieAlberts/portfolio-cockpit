# DATA CONFIDENCE (0-100). Onder decision.data_confidence_min => DATA_CHECK.
component_weights:
  completeness: 0.30
  source_quality: 0.20
  freshness: 0.25
  consistency: 0.25

source_quality:          # per source_type, 0..1
  FILING: 1.00           # jaarverslag / 10-K / 20-F / SFCR
  REGULATOR: 1.00
  IR_RELEASE: 0.95
  DATA_VENDOR: 0.85      # bv. InvestingPro
  MANUAL: 0.75           # eigen beoordeling (thesis/mijlpalen)
  NEWS: 0.60
  SAMPLE: 0.90           # voorbeelddata in demo/tests
  UNKNOWN: 0.30

freshness:
  fundamental_max_age_days: 200   # ouder => STALE_DATA
  valuation_max_age_days: 7       # koers/waarderingsinputs
  stale_penalty_floor: 0.0        # score van een stale datapunt (lineair aflopend tot 2x max age)
  max_stale_fundamental_share: 0.5   # meer dan de helft van de fundamentele data verouderd => cap

consistency:
  conflict_tolerance_rel: 0.05    # bronnen verschillen >5% => SOURCE_CONFLICT
  anomaly_rel_jump: 1.5           # waarde verandert >150% t.o.v. vorige meting => CALCULATION_ANOMALY
  anomaly_check_metrics: [shares_outstanding, bvps, book_value_per_share, navps, forward_eps,
                          eps_ttm, ebit, ebitda, normalized_ebitda, fcf, risked_npv]

min_required_quality_coverage: 0.80   # aandeel van het profielgewicht dat aanwezig moet zijn

caps:                    # harde plafonds, zodat ontbrekende data nooit "toch door" glipt
  missing_data: 60       # < data_confidence_min => DATA_CHECK
  source_conflict: 79    # materiële bronconflicten eerst uitzoeken
  calculation_anomaly: 79
  stale_fundamentals: 75
