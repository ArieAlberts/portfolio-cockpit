name: daily-source-monitor

on:
  push:
    paths:
      - ".github/workflows/daily-source-monitor.yml"
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-source-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COCKPIT_USER_AGENT: ${{ secrets.COCKPIT_USER_AGENT }}
      COCKPIT_HEARTBEAT_URL: ${{ secrets.COCKPIT_HEARTBEAT_URL }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Compile Python sources and operational scripts
        run: python -m compileall -q src scripts

      - name: Smoke-test monitor CLIs
        run: |
          python scripts/monitor_sources.py --help >/dev/null
          python scripts/monitor_peer_sources.py --help >/dev/null

      - name: Run deterministic offline tests
        run: pytest -q --tb=short

      - name: Poll target-company official sources
        run: python scripts/monitor_sources.py --fail-if-all-error

      - name: Poll peer-company official sources
        run: python scripts/monitor_peer_sources.py --fail-if-all-error

      - name: Commit monitoring state and review events
        shell: bash
        run: |
          paths=(data/monitoring)
          for path in data/source_events data/peer_source_events; do
            if [ -e "$path" ]; then
              paths+=("$path")
            fi
          done

          git add -A -- "${paths[@]}"

          if git diff --cached --quiet; then
            echo "No monitoring-state changes."
          else
            git config user.name "portfolio-cockpit-bot"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "chore: update target and peer source state"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Optional dead-man heartbeat
        if: ${{ success() }}
        shell: bash
        run: |
          if [ -n "$COCKPIT_HEARTBEAT_URL" ]; then
            curl --fail --silent --show-error --retry 3 --max-time 20 "$COCKPIT_HEARTBEAT_URL"
          else
            echo "COCKPIT_HEARTBEAT_URL not configured; skipping external heartbeat."
          fi
