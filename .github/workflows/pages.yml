name: Deploy Portfolio Cockpit to GitHub Pages

# Publishes only the static dashboard HTML (index.html + .nojekyll).
# rebuild-decision-layer commits its snapshots with GITHUB_TOKEN, and such
# pushes do not start workflows; workflow_run makes sure every rebuild is
# followed by a fresh deploy built from the latest main.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [rebuild-decision-layer]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install cockpit
        run: pip install -e .

      - name: Build static dashboard
        run: python scripts/build_dashboard.py

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp out/dashboard.html _site/index.html
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
