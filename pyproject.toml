[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-cockpit"
version = "0.1.0"
description = "Fundamental portfolio monitoring foundation with quality, drift, valuation and data-confidence separation."
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
]

[project.scripts]
cockpit-score = "portfolio_cockpit.scoring.pipeline:main"
cockpit-drift = "portfolio_cockpit.decision_layer.drift:main"
cockpit-valuation = "portfolio_cockpit.decision_layer.valuation:main"
cockpit-check-inputs = "portfolio_cockpit.decision_layer.inputs:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "hypothesis>=6.112",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "network: explicit external-network integration test; not part of deterministic unit CI",
]
