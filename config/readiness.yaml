minimum_peer_values_per_metric: 4
minimum_weighted_component_coverage: 0.70

hard_block_status_contains:
  - INSUFFICIENT
  - BLOCK_STRICT_SCORE
  - MIXED_FISCAL_PERIODS_CONTEXT_ONLY
  - SCOPE_REVIEW_REQUIRED

component_metric_aliases:
  GENERAL_OPERATING_COMPANY:
    balance_sheet:
      - net_debt_to_ebitda
      - leverage_ratio
      - net_cash
      - net_debt
    profitability_capital_efficiency:
      - reported_margin_pct
      - company_adjusted_operating_margin_pct
      - adjusted_ebita_margin_pct
      - adjusted_ebitda_margin_pct
      - adjusted_operating_margin_pct
      - adjusted_ebit_margin_pct
      - operating_margin_pct
      - restaurant_margin_pct
      - gross_margin_pct
      - ytd_operating_margin_pct
    cashflow_quality:
      - free_cash_flow_margin_pct
      - operating_cash_flow_margin_pct
      - cash_conversion_pct
    growth_stability:
      - organic_like_revenue_growth_pct
      - organic_revenue_growth_pct
      - reported_revenue_growth_pct
      - revenue_growth_pct
      - comparable_sales_growth_pct
      - constant_currency_revenue_growth_pct
      - backlog_growth_pct
    value_per_share:
      - adjusted_eps_growth_pct
      - company_adjusted_eps_growth_pct
      - eps_growth_pct
      - operating_eps_growth_pct
      - share_count_change_pct
      - weighted_average_share_change_pct

  INSURER:
    capital_strength:
      - solvency_ratio_pct
    underwriting_quality:
      - combined_ratio_pct
      - loss_ratio_pct
    profitability:
      - annualized_roe_pct
      - operating_roe_pct
      - reported_roe_pct
    growth_stability:
      - operating_earnings_growth_pct
      - operating_capital_generation_growth_pct
      - gross_written_premium_growth_pct
      - premium_growth_pct
    value_per_share:
      - gaap_eps_growth_pct
      - operating_eps_growth_pct
      - eps_growth_pct
      - dividend_growth_pct
      - share_count_change_pct

  CYCLICAL_MINING:
    balance_sheet:
      - net_debt_to_ebitda
      - net_debt_usd_m
    cost_position:
      - c1_cash_cost_usd_per_lb
    normalized_cashflow:
      - operating_cash_flow_margin_pct
      - operating_cash_flow_usd_m
    execution:
      - copper_production_tonnes
      - production_growth_pct
    value_per_share:
      - eps_growth_pct
      - diluted_eps_growth_pct

  PRE_REVENUE_DEVELOPMENT:
    liquidity_runway:
      - cash_and_investments_usd_m
      - cash_runway_months
      - operating_cash_burn_usd_m
    financing_dilution:
      - dilution_rate
      - shares_issued_h1_m
    regulatory_milestones:
      - regulatory_progress
    project_execution:
      - project_milestone_progress
    commercial_validation:
      - contracted_backlog
      - commercial_contracts

  FINANCIAL_SERVICES:
    balance_sheet:
      - capital_ratio
      - net_debt_to_ebitda
    profitability:
      - roe
      - roa
      - adjusted_eps_growth_pct
    asset_quality:
      - credit_or_asset_quality
    growth_stability:
      - revenue_growth_pct
    value_per_share:
      - book_value_per_share_growth
      - share_count_change_pct
