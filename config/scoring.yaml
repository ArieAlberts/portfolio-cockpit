fundamental_quality:
  scale_min: 0
  scale_mid: 50
  scale_max: 100
  peer_method: clipped_mean_sample_std_zscore
  score_formula: "clamp(50 + 25 * weighted_z, 0, 100)"
  clip_z_score: 3.0
  minimum_metric_coverage: 0.70
  minimum_component_metric_weight_coverage: 0.50
  minimum_peer_values_per_metric: 4
  sensitivity:
    method: leave_one_peer_out_per_metric
    diagnostic_minimum_peer_values: 3
    stable_band_width_points: 10.0
    unstable_band_width_points: 25.0
    peer_sensitive_blocks_display_ready: true
    robust_method_reconsider_at_peer_count: 8

quality_drift:
  baseline: 50.0
  scale_min: 0
  scale_max: 100
  price_changes_affect_score: false
  allowed_update_triggers:
    - official_results
    - official_trading_update
    - regulatory_filing
    - material_guidance_change
    - confirmed_thesis_event

valuation:
  scale_min: 0
  scale_mid: 50
  scale_max: 100
  higher_is_more_attractive: true

data_confidence:
  scale_min: 0
  scale_max: 100
  decision_threshold: 80
  components:
    completeness: 0.30
    source_quality: 0.30
    freshness: 0.20
    consistency: 0.20

portfolio_risk:
  default_single_stock_shock: -0.30

calculation_validation:
  enabled: true
  absolute_tolerance: 0.001
  relative_tolerance: 0.00001
  block_score_eligible_mismatch: true
