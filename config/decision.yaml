# Decision Engine — every threshold lives here. Output is a decision_state
# plus reasons only. Never orders; every output carries execution_effect: NONE.
# Decisions compare the CURRENT weight with the score-adjusted target
# (config/target_adjustment.yaml), not with the base target.
schema_version: 1
data_confidence_min: 80          # must equal scoring.yaml data_confidence.decision_threshold

drift:
  deteriorated_score_max: 40     # drift <= this            -> REVIEW_REDUCE
  deteriorated_recent_change_max: -10  # drift_change_recent <= this -> REVIEW_REDUCE

limits:                          # also cap the score-adjusted target
  max_position_weight_pct: 10.0
  max_sector_weight_pct: 30.0
  max_single_position_impact_pp: 3.0

fundamental_quality:
  fq_add_floor: 35               # applies only when FQ is DISPLAY_READY

thesis_status_values: [INTACT, WATCH, BROKEN]
