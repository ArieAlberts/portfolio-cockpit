schema_version: 1
defaults:
  timeout_seconds: 20
  user_agent: "PortfolioCockpit/0.1 (+https://github.com/ArieAlberts/portfolio-cockpit)"
  resolve_sec_tickers: true
  first_observation_creates_event: false
  peer_source_change_changes_score: false
  live_execution_allowed: false
  retry_attempts: 3
  retry_base_seconds: 1.0
  circuit_breaker_failure_threshold: 3
  html_fingerprint_mode: RELEVANT_LINKS
  html_link_patterns: ["result", "report", "financial", "press", "release", "interim", "half", "annual", "\\.pdf"]

# Durable official discovery pages for non-US peers where SEC resolution is
# unavailable or ticker suffixes make issuer discovery less reliable.
discovery_overrides:
  RELX.L:
    mode: HTML_PAGE
    url: https://www.relx.com/investors/results
    source_quality: HIGH
