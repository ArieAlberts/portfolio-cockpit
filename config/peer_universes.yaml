# Curated peer universes for Fundamental Quality normalization.
# These are MODEL-CURATED business-model peers, not claims of official company peer lists.
# Scores must not be calculated if status is INSUFFICIENT or if the minimum peer count is not met.

defaults:
  minimum_peer_count: 4
  method: clipped_mean_sample_std_zscore
  clip_z: 3.0
  require_public_financials: true

universes:
  ASR:
    label: European diversified insurers
    status: LIMITED
    confidence: MEDIUM
    peers: [NN.AS, AGS.BR, SAMPO.HE, AV.L, ZURN.SW]
    comparable_metrics: [solvency_ratio, roe, operating_result_growth, book_value_per_share_growth, dividend_per_share_growth]

  ADM.L:
    label: UK personal-lines insurers
    status: INSUFFICIENT
    confidence: LOW
    peers: [SBRE.L, AV.L]
    context_only: [SAGA.L]
    minimum_peer_count: 3
    comparable_metrics: [solvency_ratio, combined_ratio, roe, earnings_per_share_growth, dividend_per_share_growth]
    note: Only Sabre is a close listed UK motor-underwriting peer. Aviva is a broad comparator after Direct Line integration. Saga sold its underwriting business and is context-only. Do not calculate a peer-normalized Fundamental Quality score yet.

  WKL:
    label: Professional information and analytics services
    status: VALIDATE
    confidence: HIGH
    peers: [RELX.L, TRI.TO, VRSK, FDS, SPGI, MCO]
    comparable_metrics: [net_debt_to_ebitda, roic, operating_margin, fcf_conversion, organic_revenue_growth, eps_growth, share_count_change]

