# Valuation — market-price dependent. 50 ~ fair versus reference
# (own history + peers); higher = more attractive, lower = more expensive.
#
# Units: amounts (net_debt, ebit, ebitda, fcf, distributions_ttm, risked_npv)
# in millions of the trading currency; shares_outstanding in millions;
# per-share values (price, eps, bvps, navps) in the trading currency unit.
#
# Per metric:
#   formula: key in the whitelisted FORMULAS registry (no eval)
#   cheaper_when: lower (multiples) | higher (yields)
#   full_scale: relative deviation from reference that yields +/-50 points
#   requires_positive_denominator: zero/negative denominator or numerator
#     => NOT_APPLICABLE. A negative P/E or EV/EBITDA is never cheap.
schema_version: 1
max_price_age_days: 7
minimum_metric_weight_coverage: 0.50
labels:
  attractive_min: 60
  fair_min: 45
reference_weights:
  own_history: 0.6
  peers: 0.4

metrics:
  forward_pe: {formula: price_over_forward_eps, cheaper_when: lower, full_scale: 0.40, requires_positive_denominator: true}
  pe: {formula: price_over_eps, cheaper_when: lower, full_scale: 0.40, requires_positive_denominator: true}
  ev_ebit: {formula: ev_over_ebit, cheaper_when: lower, full_scale: 0.40, requires_positive_denominator: true}
  ev_ebitda: {formula: ev_over_ebitda, cheaper_when: lower, full_scale: 0.40, requires_positive_denominator: true}
  ev_normalized_ebitda: {formula: ev_over_normalized_ebitda, cheaper_when: lower, full_scale: 0.40, requires_positive_denominator: true}
  fcf_yield: {formula: fcf_over_market_cap, cheaper_when: higher, full_scale: 0.40, requires_positive_denominator: false}
  price_to_book: {formula: price_over_bvps, cheaper_when: lower, full_scale: 0.40, requires_positive_denominator: true}
  shareholder_yield: {formula: distributions_over_market_cap, cheaper_when: higher, full_scale: 0.40, requires_positive_denominator: false}
  price_to_nav: {formula: price_over_navps, cheaper_when: lower, full_scale: 0.40, requires_positive_denominator: true}
  market_cap_to_risked_npv: {formula: market_cap_over_risked_npv, cheaper_when: lower, full_scale: 0.50, requires_positive_denominator: true}

profiles:
  GENERAL_OPERATING_COMPANY:
    weights: {forward_pe: 0.30, ev_ebit: 0.30, fcf_yield: 0.40}
    not_applicable: []
  INSURER:
    weights: {price_to_book: 0.35, pe: 0.35, shareholder_yield: 0.30}
    not_applicable: [ev_ebitda, ev_ebit, fcf_yield]
  INSURER_US_P&C:
    weights: {price_to_book: 0.35, pe: 0.35, shareholder_yield: 0.30}
    not_applicable: [ev_ebitda, ev_ebit, fcf_yield]
  PRE_REVENUE_DEVELOPMENT:
    weights: {price_to_nav: 0.60, market_cap_to_risked_npv: 0.40}
    not_applicable: [pe, forward_pe, ev_ebitda, ev_ebit, fcf_yield]
  CYCLICAL_MINING:
    weights: {price_to_nav: 0.40, ev_normalized_ebitda: 0.30, fcf_yield: 0.30}
    not_applicable: [pe, forward_pe]
  # Proposal, pending owner confirmation: balance-sheet financial, so EV-based
  # and industrial FCF multiples are not meaningful.
  FINANCIAL_SERVICES:
    weights: {forward_pe: 0.40, pe: 0.30, price_to_book: 0.30}
    not_applicable: [ev_ebitda, ev_ebit, fcf_yield]
