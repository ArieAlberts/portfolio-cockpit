# PORTFOLIO RISK — los van quality en valuation.
# Kolom heet voortaan PORTFOLIO IMPACT -30%:  portfolio_impact = position_weight * -30%
standard_shock: -0.30

scenarios:
  market_shock:
    description: "Brede markt -20% (beta-gewogen indien beta bekend)"
    type: market
    shock: -0.20
    use_beta: true
  sector_shock:
    description: "Eén sector -30%"
    type: sector
    sector: Financials
    shock: -0.30
  single_stock_shock:
    description: "Grootste positie -30%"
    type: single_stock
    target: largest
    shock: -0.30
  combined_scenario:
    description: "Markt -15% plus sector Materials extra -20%"
    type: combined
    components:
      - {type: market, shock: -0.15, use_beta: true}
      - {type: sector, sector: Materials, shock: -0.20}
